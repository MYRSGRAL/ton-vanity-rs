[package]
name = "brut-wallet"
version = "0.3.0"
edition = "2024"
rust-version = "1.89"
license = "AGPL-3.0-only"
description = "Генератор собственных TON W5 vanity-кошельков на CPU и OpenCL"

[dependencies]
anyhow = "1"
base64 = "0.22"
bip39 = { version = "2", features = ["zeroize"] }
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
ed25519-dalek = { version = "2", features = ["zeroize"] }
hmac = "0.12"
opencl3 = "0.12.3"
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tempfile = "3"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
